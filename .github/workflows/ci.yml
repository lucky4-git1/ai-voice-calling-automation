name: Continuous Integration & Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "e9a8f27c3d1b4a5e8f0123456789abcdef0123456789abcdef0123456789abcdef"
      ENCRYPTION_KEY: "01234567890123456789012345678901"
      NODE_ENV: "test"
      PORT: "4000"
      API_PUBLIC_URL: "http://localhost:4000"
      WEB_PUBLIC_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: "http://localhost:4000"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment Files
        run: |
          cp .env.example .env
          cp .env.example apps/api/.env

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve Builds
        run: pnpm approve-builds --all

      - name: Build Shared Types & Schemas
        run: pnpm --filter @callagent/shared build

      - name: Generate Prisma Client & Run Seed
        run: |
          pnpm --filter @callagent/api prisma:generate
          pnpm --filter @callagent/api exec prisma db push --accept-data-loss
          pnpm --filter @callagent/api prisma:seed

      - name: Run Backend Integration & Unit Tests
        run: pnpm --filter @callagent/api exec tsx --test test/tenant-isolation.spec.ts test/campaign-dnc-safeguard.spec.ts test/voice-runtime-turn.spec.ts

      - name: Build Backend Service
        run: pnpm --filter @callagent/api build

      - name: Build Frontend Application
        run: pnpm --filter @callagent/web build

